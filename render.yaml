services:
  - type: web
    name: dalat-services
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: Dockerfile.render

    envVars:
      - key: APP_NAME
        value: "Dalat Services"

      - key: APP_ENV
        value: production

      - key: APP_KEY
        generateValue: true

      - key: APP_DEBUG
        value: "false"

      # Public browser origin (Vercel custom domain). Must match the domain users open
      # so Vite/asset URLs are same-origin and avoid CORS to onrender.com.
      - key: APP_URL
        value: https://dalatservices.tranngochung.id.vn

      - key: APP_LOCALE
        value: vi

      - key: APP_FALLBACK_LOCALE
        value: vi

      - key: DB_CONNECTION
        value: pgsql

      - key: DB_URL
        fromDatabase:
          name: dalat-services-db
          property: connectionString

      - key: SESSION_DRIVER
        value: database

      - key: SESSION_LIFETIME
        value: "120"

      - key: SESSION_SECURE_COOKIE
        value: "true"

      - key: CACHE_STORE
        value: database

      - key: QUEUE_CONNECTION
        value: sync

      - key: BROADCAST_CONNECTION
        value: log

      - key: FILESYSTEM_DISK
        value: local

      - key: BCRYPT_ROUNDS
        value: "12"

      - key: MAIL_MAILER
        value: log

      - key: PAYMENTS_DEMO_ENABLED
        value: "false"

      - key: VITE_APP_NAME
        value: "Dalat Services"

      - key: VITE_REVERB_ENABLED
        value: "false"

      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_MODEL
        value: gpt-4o


databases:
  - name: dalat-services-db
    plan: free
    region: singapore
    databaseName: dalat_services
    user: dalat_services