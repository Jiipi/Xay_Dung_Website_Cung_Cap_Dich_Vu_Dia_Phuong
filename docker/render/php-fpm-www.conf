[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Surface PHP-FPM worker stdout/stderr in container logs (Render).
catch_workers_output = yes
decorate_workers_output = no

; CRITICAL on Render: keep container env (APP_KEY, DB_URL, SESSION_*) in workers.
; Default php-fpm clear_env=yes drops them → empty APP_KEY at request time even
; when entrypoint validated the key and config:cache ran as root.
clear_env = no
